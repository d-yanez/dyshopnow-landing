steps:
  # Construir la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'build', '-t', 'gcr.io/$PROJECT_ID/dyshopnow-landing', '.' ]

  # Subir la imagen al Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'push', 'gcr.io/$PROJECT_ID/dyshopnow-landing' ]

  # Desplegar a Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - dyshopnow-landing
      - --image=gcr.io/$PROJECT_ID/dyshopnow-landing
      - --platform=managed
      - --region=us-central1
      - --allow-unauthenticated
